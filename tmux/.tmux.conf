set -ga terminal-overrides ",screen-256-color*:Tc"
set-option -g default-terminal "screen-256color"
set -s escape-time 0

set -g @color_default "#333333"
set -g @color_on_default "#5eacd3"
set -g @color_window_highlight "#colour32"
set -g @color_window_on_highlight "#colour15"
set -g @color_os "#000000"
set -g @color_on_os "#ffffff"

set -g status-style 'bg=#{@color_default} fg=#{@color_on_default}'
set -g window-status-style 'bg=#{@color_default} fg=#{color_on_default}'
set -g window-status-current-style 'bg=#{@color_default} fg=#{@color_on_default}'

bind r source-file ~/.config/tmux/.tmux.conf

set -g base-index 1

set-window-option -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection

# OS Specific Configurations
# If Darwin, load darwin specific config
if-shell 'uname | grep -q Darwin' 'source-file ~/.config/tmux/.tmux.darwin.conf'

# If Linux, load linux specific config
if-shell 'uname | grep -q Linux' 'source-file ~/.config/tmux/.tmux.linux.conf'

### Common Theming
# Default status-bar left
# set-option -g status-left "[#S] "

set-option -g status-left "\
#{?client_prefix,#[bg=colour167],}\
#[fg=#{@color_on_os}, bg=#{@color_os}]  #S \
#{?client_prefix,#[fg=colour167],}\
#[fg=#{@color_os}, bg=default]\
#{?window_zoomed_flag, ,}\
"

# Tmux Window Tabs

# Active Window Highlight
set-window-option -g window-status-current-format "\
#[bg=#{@color_window_highlight}, fg=#{@color_default}]\
#[fg=#{@color_window_on_highlight}, bg=#{@color_window_highlight}] \
#I*  #[bold]#W \
#[fg=#{@color_window_highlight}, bg=default]\
"

# Inactive Windows
set-window-option -g window-status-format "\
#[fg=#{@color_default}]\
#[fg=#{@color_window_highlight}] \
#I*  #W \
#[fg=#{@color_default}]\
"

