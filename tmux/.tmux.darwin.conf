set -g @color_os "#ffffff"
set -g @color_on_os "#000000"

set -g @color_default "#556688"
set -g @color_on_default "#5eacd3"
set -g @color_window_highlight "#ffffff"
set -g @color_window_on_highlight "#000000"

# macOS specific copy command
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"
# bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'xclip -in -selection -clipboard'

# Default status-bar right
# set-option -g status-right " \"#{=21:pane_title}\" %H:%M %d-%b-%y"

# Right bar Theming for Darwin Based systems
# This will help with identifying which machine we are connected to, and
# may help prevent accidents

set-option -g status-right "\
#[fg=#{@color_os}] #[fg=#{@color_on_os}, bg=#{@color_os}] \
 $USER@#H \
"
